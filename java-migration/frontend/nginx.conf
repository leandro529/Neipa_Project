# La SPA usa react-router (BrowserRouter): cualquier ruta que no matchee un
# archivo estatico tiene que caer a index.html para que el router del lado
# del cliente la resuelva (si no, /segmentos recargado a mano da 404).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
